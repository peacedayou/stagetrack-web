name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Tests (bUnit + xUnit)
        run: dotnet test tests/StageTrack.Web.Tests/StageTrack.Web.Tests.csproj --logger "console;verbosity=normal"
      - name: Publication
        run: dotnet publish src/StageTrack.Web/StageTrack.Web.csproj -c Release -o publish
      - name: Préparer GitHub Pages (sous-dossier /stagetrack-web/)
        run: |
          sed -i 's|<base href="/" />|<base href="/stagetrack-web/" />|' publish/wwwroot/index.html
          touch publish/wwwroot/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: publish/wwwroot

  deploy:
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
